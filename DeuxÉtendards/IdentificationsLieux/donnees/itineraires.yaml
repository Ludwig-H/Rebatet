  date: 12 juillet 1925
  nature: attestee
  resume: >-
    Messe à Saint-Jean, montée à pied à la gare de Saint-Just, train de Vaugneray
    (hors carte), descente par la « ficelle », tramway à l'angle du pont Tilsitt,
    restaurant de la rue des Marronniers, quais du Rhône, pèlerinage au
    Six-Janvier, retour à l'hôtel de la rue Victor-Hugo.
  refs: [XV §73, XV §75, XV §189, XV §191, XV §197, XV §199, XV §217, XV §219, XV §255-256, XV §261]
