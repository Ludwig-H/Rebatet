# Itinéraires lyonnais des *Deux Étendards*
#
# Chaque itinéraire est une suite d'étapes ATTESTÉES par le texte (référence
# chapitre § en numérotation <p>, cf. METHODE.md). Le tracé entre deux
# étapes est RECONSTITUÉ par outils/itineraires.py : plus court chemin sur la
# voirie actuelle (fond OpenStreetMap conservé dans fond_osm.geojson). Il ne
# prétend pas restituer les rues réellement suivies, que le roman ne donne pas.
# « via » = point de passage ajouté pour forcer un pont ou un quai nommé par le
# texte ; « hors_carte » = étape hors du centre (non routée).

itineraires:

- id: IT1
  titre: Le chemin des amoureux, de la place Morand à la place Antique
  date: janvier 1925 – mars 1926 (itinéraire type)
  nature: composite
  resume: >-
    Trajet quotidien reconstitué à partir de plusieurs passages : sortie du cours
    Boudier, avenue de Saxe, café des Alpes (secteur), angle du Six-Janvier, rue Créqui,
    église Saint-Louis, petite rue Saint-Michel, place Antique, puis retour vers le
    cours Gambetta par la place du Pont.
  refs: [IV §24-27, XXII §35, XII §124, XII §155, XXIV §2, XXII §99, XXIII §228, XXV §181]
  etapes:
  - {nom: sortie du cours Boudier (« à l'angle de la place Morand »), lieu: B04, lat: 45.76870, lon: 4.84330, ref: XXII §34, a_confirmer: true}
  - {nom: avenue de Saxe × cours Franklin-Roosevelt, via: true, lat: 45.76863, lon: 4.84390}
  - {nom: "café des Alpes (avenue de Saxe, « un peu après le cours La Fayette »)",lieu: B02, lat: 45.76259, lon: 4.84517, ref: XXII §35, a_confirmer: true}
  - {nom: angle du Six-Janvier (Créqui / Rabelais), lieu: B01, lat: 45.76287, lon: 4.84720, ref: XII §124}
  - {nom: rue Créqui × cours Gambetta (place de l'Abondance), lieu: G20, lat: 45.75320, lon: 4.84903, ref: XXII §99}
  - {nom: église Saint-Louis, lieu: G19, lat: 45.75104, lon: 4.84820, ref: XXII §99}
  - {nom: rue Saint-Michel × rue de la Madeleine (voûte Saint-Michel), via: true, lat: 45.75041, lon: 4.84800}
  - {nom: place Antique, lieu: G01, lat: 45.75340, lon: 4.84270, ref: XXIII §228}
  - {nom: rue de la Vierge × Grande-Rue, via: true, lat: 45.75381, lon: 4.84411}
  - {nom: place du Pont, lieu: G13, lat: 45.75520, lon: 4.84300, ref: XXV §181}
  - {nom: "« 3 bis » cours Gambetta (Villars) : n° 5 au recensement de 1926", lieu: G08, lat: 45.755912, lon: 4.841743, ref: XXIX §106}

- id: IT2
