- id: IT3
  titre: La poursuite de « Gaupette », 14 novembre 1925
  date: 14 novembre 1925, 18 h
  nature: attestee
  resume: >-
    Michel, en route vers le rendez-vous de la rue Créqui, suit une fillette :
    rue de la République, quai de Retz, pont Morand, place Morand, avenue de
    Noailles, boulevard des Belges (hôtel des « V… D… »), puis vers l'avenue du
    Parc et la tête de ligne des tramways ; le tram traverse ensuite la
    Guillotière jusqu'au bouge « À la ville d'Oran » (hors carte, non localisé).
  refs: [XXI §91, XXI §92, XXI §93, XXI §94, XXI §95, XXI §97, XXI §102, XXI §104]
  etapes:
  - {nom: angle rue de la République / rue Dubois, lat: 45.76376, lon: 4.83503, ref: XXI §91}
  - {nom: quai de Retz, lieu: P36, lat: 45.76550, lon: 4.83870, ref: XXI §92}
  - {nom: pont Morand, lieu: B06, lat: 45.76864, lon: 4.84043, ref: XXI §92}
  - {nom: place Morand, lieu: B05, lat: 45.76775, lon: 4.84210, ref: XXI §93}
  - {nom: avenue de Noailles, lieu: B15, lat: 45.77177, lon: 4.84323, ref: XXI §93}
  - {nom: boulevard des Belges (hôtel des « V… D… »), lieu: B12, lat: 45.77577, lon: 4.84336, ref: XXI §94}
  - {nom: "avenue du Parc, tête de ligne des tramways",lieu: B16, lat: 45.77680, lon: 4.84411, ref: XXI §95-97}

- id: IT4
  titre: Les « théologiens de Bellecour », nuit du 6 janvier 1926
  date: 6 janvier 1926, soir
  nature: attestee
  resume: >-
    Régis attend Michel à l'angle de la place du Pont, sur le chemin de la
    bibliothèque ; ils vont « jusqu'au quai », font demi-tour à l'entrée du pont
    Tilsitt, arpentent « la courte rue qui va du quai à la place », puis font des
    heures durant « le tour de Bellecour » (Maison Dorée, Cercle militaire, rue
    Gasparin, kiosque), avant d'obliquer vers la rue Victor-Hugo.
  refs: [XXIII §9, XXIII §13, XXIII §27-28, XXIII §49, XXIII §61, XXIII §94, XXIII §123, XXIII §130]
  etapes:
  - {nom: angle de la place du Pont, lieu: G13, lat: 45.75520, lon: 4.84300, ref: XXIII §9}
  - {nom: pont de la Guillotière, via: true, lat: 45.75662, lon: 4.83892}
  - {nom: rue de la Barre, via: true, lat: 45.75794, lon: 4.83414}
  - {nom: entrée du pont Tilsitt (demi-tour), lieu: P26, lat: 45.75923, lon: 4.82937, ref: XXIII §27}
  - {nom: "le tour de Bellecour : devant la Maison Dorée", lieu: P02, lat: 45.75762, lon: 4.83083, ref: XXIII §28 ; XXIII §49}
  - {nom: Bellecour angle sud-ouest, via: true, lat: 45.75715, lon: 4.82992}
  - {nom: Bellecour côté sud, via: true, lat: 45.75660, lon: 4.83273}
  - {nom: Bellecour angle nord-est, via: true, lat: 45.75791, lon: 4.83432}
  - {nom: "angle de la rue Gasparin, en face du Cercle militaire", lieu: P07, lat: 45.75822, lon: 4.83314, ref: XXIII §61}
  - {nom: Bellecour angle nord-ouest, via: true, lat: 45.75885, lon: 4.83076}
  - {nom: "la grande allée : Maison Dorée et kiosque à musique", lieu: P02, lat: 45.75762, lon: 4.83083, ref: XXIII §94 ; XXIII §123}
  - {nom: débouché de la rue Victor-Hugo, lieu: P17, lat: 45.75683, lon: 4.83154, ref: XXIII §130}

