ache)"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P20_Gare_de_Perrache_buffet_terre_plein_escaliers.md"}, {"num": 11, "id": "quai_perrache", "code": "P23", "nom": "« Quai Perrache » — le banc de la « vocation », rive de la Saône", "statut": "probable", "certitude": "C", "geometry": {"type": "LineString", "coordinates": [[4.825732, 45.754618], [4.824001, 45.751531], [4.823648, 45.751123]]}, "ancre": [4.824001, 45.751531], "precision_m": 200, "description": "Banc au bord de la Saône où Régis et Anne-Marie se sont promis à la vie religieuse le 30 septembre 1923, au lendemain du premier Brouilly, et où Régis conduit Michel au printemps 1925 ; lieu de pèlerinage du trio. Le roman l'appelle « quai Perrache », alors que le quai officiel de ce nom longe le Rhône : zone probable sur l'ancien quai d'Occident, au nord du pont ferroviaire ; le banc n'est pas localisé.", "nom_actuel": "quai Maréchal-Joffre (2e)", "refs": ["XII §164-175", "XIII §25-26", "XIII §39", "XVII §10", "XVII §84", "XVII §231", "XVII §259", "XIX §260-264", "XX §83", "XX §91-95", "XXI §68", "XXII §181", "XXII §330", "XXII §432", "XXIII §132", "XXVI §33", "XXXVII §68", "XXXVII §73"], "sources": ["Archives municipales de Lyon, liste des voies anciennes (voies_anciennes.txt) : Maréchal Joffre (quai), Occident (quai d'), renommé en 1931 ; Kitchener-Marchand (pont), Séguin (pont), renommé en 1954 ; Perrache (quai), Perrache (chaussée)", "POP, IA69000823 (viaduc de la Quarantaine) et IA69000477 (quai Perrache)", "fond OSM du dossier (04_Donnees/fond_osm.geojson, extrait du 23 octobre 2026, © contributeurs OpenStreetMap)"], "fiche": "../03_Fiches/02_toponymes_et_adresses.md", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P23_Quai_Perrache_le_banc_de_la_vocation_rive_de_la_Sa.md"}, {"num": 12, "id": "fourviere", "code": "D01", "nom": "Fourvière (basilique, terre-plein et coteau)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.82259, 45.76228]}, "ancre": [4.82259, 45.76228], "precision_m": 150, "description": "Scène principale : la montée du trio au terre-plein, le panorama, la visite de la basilique et la descente entre les couvents (X §1-30, 3 avril 1925). Le coteau sert ailleurs de décor de promenade (pentes, jardins, couvents) et de repère vu de la Saône ; la montée du jour de l'an est rituelle (XXII §370).", "nom_actuel": "basilique Notre-Dame de Fourvière, esplanade de Fourvière (5e)", "refs": ["X §1", "X §14-22", "X §25", "XII §168", "XII §173", "XV §597", "XXII §370", "XXVII §102", "XXVIII §98", "XXIX §93", "III §43", "XXII §268", "XXX §93", "Récit de Guitte §3"], "sources": ["https://www.fourviere.org/fr/vie-du-site-notre-dame-de-fourviere/lhistoire/de-la-construction-de-la-basilique-a-nos-jours/"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Rive_droite/D01_Fourviere_basilique_terre_plein_et_coteau.md"}, {"num": 13, "id": "saint_jean", "code": "D03", "nom": "Cathédrale (primatiale) Saint-Jean", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.82742, 45.76071]}, "ancre": [4.82742, 45.76071], "precision_m": 60, "description": "La messe dominicale de neuf heures où Michel accompagne Régis (XII §144-153) et le rendez-vous du quatuor « devant Saint-Jean », suivi de la messe, avant l'excursion de Vaugneray (XV §73-74, 12 juillet 1925). Ailleurs, repère sonore (IX §41) et visuel (XIX §143 ; XXXVII §73). À distinguer de la bibliothèque voisine (D04), du quartier Saint-Jean (D11), où se trouve aussi la boutique du « curé russe » (D10), et de la gare basse de la « ficelle » (D05).", "nom_actuel": "primatiale Saint-Jean-Baptiste, 8 place Saint-Jean (5e)", "refs": ["I §65", "IX §41", "XII §144-153", "XV §73-74", "XIX §143", "XXXVII §73"], "sources": ["https://www.lyon.fr/lieu/moyen-age/cathedrale-saint-jean", "https://www.visiterlyon.com/decouvrir/sites-et-monuments/patrimoine-religieux/primatiale-cathedrale-saint-jean-baptiste"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Rive_droite/D03_Cathedrale_primatiale_Saint_Jean.md"}, {"num": 14, "id": "bibliotheque", "code": "D04", "nom": "Bibliothèque de la Ville (palais Saint-Jean)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.8277, 45.76022]}, "ancre": [4.8277, 45.76022], "precision_m": 50, "description": "Lieu de travail du soir de Michel et de Régis, « de huit à dix » (XXI §36), et point de départ des retours « de Saint-Jean à la Guillotière » (XX §117). La cour sert de lieu de rendez-vous (XXII §233) ; en novembre 1927, Régis la montre depuis l'autre rive (XXXVII §73). Michel la fréquente déjà en 1922-1923 (I §121). Ne pas la placer à la Part-Dieu (bibliothèque centrale après 1972).", "nom_actuel": "bibliothèque du 5e Saint-Jean, 4 avenue Adolphe-Max", "refs": ["I §121", "XIX §143", "XX §117", "XXI §36", "XXI §58", "XXI §84", "XXII §151", "XXII §233", "XXII §301", "XXII §421", "XXIII §9", "XXIII §180", "XXIII §279", "XXIII §291", "XXIV §117", "XXIV §250", "XXVII §11", "XXVIII §15", "XXIX §93", "XXIX §219", "XXXVII §73"], "sources": ["https://www.bm-lyon.fr/agenda/le-palais-saint-jean", "Archives municipales de Lyon, liste des voies anciennes (voies_anciennes.txt) : « Adolphe Max (avenue) / Bibliothèque (avenue de la) / renommée en 1939 » ; « Romain Rolland (quai) / Bibliothèque (quai de la) / renommé en 1945 »"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Rive_droite/D04_Bibliotheque_de_la_Ville_palais_Saint_Jean.md"}, {"num": 15, "id": "terreaux", "code": "P15", "nom": "Place des Terreaux", "statut": "atteste", "certitude": "A", "geometry": {"type": "Polygon", "coordinates": [[[4.832807, 45.767643], [4.834076, 45.767784], [4.834168, 45.767403], [4.832973, 45.767261], [4.832807, 45.767643]]]}, "ancre": [4.833506, 45.76752275], "precision_m": 30, "description": "Place de l'Hôtel de Ville, surtout traversée : Michel y aboutit dans sa fuite nocturne de mars 1925 ; Michel et Anne-Marie la traversent au sortir du concert de février 1926. Un petit café « tout près des Terreaux » et une boutique « proche des Terreaux » sont des établissements anonymes du voisinage.", "nom_actuel": "place des Terreaux (1er)", "refs": ["IX §130", "XXII §139", "XXV §137", "XXVIII §26"], "sources": ["fond OSM du dossier (04_Donnees/fond_osm.geojson, extrait du 23 octobre 2026, © contributeurs OpenStreetMap)"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P15_Place_des_Terreaux.md"}, {"num": 16, "id": "tete_or", "code": "B14", "nom": "parc de la Tête-d’Or", "statut": "atteste", "certitude": "A", "geometry": {"type": "Polygon", "coordinates": [[[4.858906, 45.779614], [4.858344, 45.77295], [4.854183, 45.772563], [4.852522, 45.773438], [4.851394, 45.773591], [4.851347, 45.774225], [4.845358, 45.776852], [4.844793, 45.777702], [4.846597, 45.779906], [4.849398, 45.782061], [4.853018, 45.783897], [4.855594, 45.784551], [4.859533, 45.784545], [4.858898, 45.780569], [4.859337, 45.779576], [4.858906, 45.779614]]]}, "ancre": [4.853281466666667, 45.77840266666667], "precision_m": 30, "description": "Grand parc municipal des Brotteaux, lieu de promenades du trio puis du couple : lac, allées, « salle de verdure », portes latérales.", "nom_actuel": "parc de la Tête-d’Or (Lyon 6e)", "refs": ["I §65", "IV §76-78", "V §32", "VIII §154", "XXVI §3", "XXVI §12-13", "XXVI §15-16", "XXVI §27-29", "XXVI §50-52", "XXVII §17", "XXX §109", "XXXIII §181", "XXXIII §195-197", "XXXIII §217"], "sources": ["https://www.openstreetmap.org/way/4077207", "OpenStreetMap, fond 04_Donnees/fond_osm.geojson (API 0.6, extraction du 23/10/2026, ODbL)", "L. Rebatet, Memorie di un fascista 1941-1947, trad. it., 1993 : https://archive.org/details/memorie-di-un-fascista", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet. Dossier d’un chef-d’œuvre maudit, Lausanne, L’Âge d’Homme, 2001 (lu par extraits : https://books.google.fr/books?id=qGVj0Eca7okC&pg=PA164)"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Brotteaux_et_3e_nord/B14_parc_de_la_Tete_dOr.md"}, {"num": 17, "id": "carreau", "code": "E02", "nom": "Chez Carreau (guinguette près de Vinatier)", "statut": "hypothese", "certitude": "D", "geometry": {"type": "Polygon", "coordinates": [[[4.88694, 45.73], [4.899, 45.73], [4.899, 45.7372], [4.8926, 45.7393], [4.89187, 45.739], [4.89028, 45.736], [4.88863, 45.733], [4.88694, 45.73]]]}, "ancre": [4.8926171428571426, 45.73492857142857], "precision_m": 600, "description": "Guinguette à tonnelles, avec une salle « au premier étage » au « galant emploi » (XXII §88-91), où vont Régis et Anne-Marie, puis le trio (XXII §86-94, premier dimanche de l'Avent 1925) ; théâtre de l'« affaire Carreau » (XXVII §6), piège monté par Anne-Marie (XXVI §140-202). On y va à pied depuis l'entrée de Vinatier, vers les jardins et les champs ; en chemin, on aperçoit au loin le fond du parc de la grand-mère (XXVI §166-167). Elle n'est pas dans l'asile ; aucune parcelle n'est identifiée.", "nom_actuel": "—", "refs": ["XXII §86-94", "XXII §101", "XXVI §140", "XXVI §154-175", "XXVI §196", "XXVI §199-202", "XXVI §216", "XXVII §1", "XXVII §5-6", "XXVIII §107-108", "XXIX §55", "XXIX §93", "XXXIII §304"], "sources": ["https://fr.wikipedia.org/wiki/Ancien_tramway_de_Lyon"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E02_Chez_Carreau_guinguette_pres_de_Vinatier.md"}, {"num": 18, "id": "modern_house", "code": "P18", "nom": "Modern House — pension de famille", "statut": "probable", "certitude": "C", "geometry": {"type": "Polygon", "coordinates": [[[4.835, 45.757], [4.836, 45.7582], [4.8374, 45.7577], [4.8366, 45.756], [4.8352, 45.7562], [4.835, 45.757]]]}, "ancre": [4.83604, 45.75702], "precision_m": 200, "description": "Pension « proche de Bellecour et du Rhône », dans une « rue mal famée » du centre, où Michel emménage au début de 1926 et qu'il quitte dès le lendemain de la visite d'Anne-Marie. Zone probable sur la Presqu'île, juste au-delà du pont de la Guillotière ; immeuble non identifié et enseigne non attestée.", "nom_actuel": "—", "refs": ["XXV §145-150", "XXV §166-177", "XXV §184", "XXV §204", "XXV §275", "XXXIII §218"], "sources": ["fond OSM du dossier (04_Donnees/fond_osm.geojson, extrait du 23 octobre 2026, © contributeurs OpenStreetMap)"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P18_Modern_House_pension_de_famille.md"}, {"num": 20, "id": "voute_saint_michel", "code": "G05", "nom": "Café de la Voûte — « sous la voûte Saint-Michel »", "statut": "hypothese", "certitude": "D", "geometry": {"type": "Point", "coordinates": [4.84797, 45.75042]}, "ancre": [4.84797, 45.75042], "precision_m": 60, "description": "Minuscule café tenu par une Ardéchoise, refuge favori de Michel et d'Anne-Marie de l'hiver au printemps 1926. Le texte le place « sous la voûte Saint-Michel » ; la seule voûte connue de la rue Saint-Michel est son débouché sous l'immeuble de la rue de la Madeleine : hypothèse de localisation ; café non attesté, existence de la voûte en 1925 à vérifier.", "nom_actuel": "débouché de la rue Saint-Michel sous l'immeuble de la rue de la Madeleine (7e)", "refs": ["XXIV §5", "XXIV §65", "XXIV §126", "XXIV §183", "XXV §6", "XXV §40", "XXVI §66", "XXVIII §200", "XXX §1-2"], "sources": ["https://www.ruesdelyon.net/rue/1376-rue-saint-michel.html", "Indicateur Henry 1925-1926 (à dépouiller : débits de boissons, rues Saint-Michel et de la Madeleine)"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Guillotiere/G05_Cafe_de_la_Voute_sous_la_voute_Saint_Michel.md"}, {"num": 21, "id": "etoile", "code": "G09", "nom": "Brasserie de l'Étoile — 1 cours Gambetta", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.841276, 45.756072]}, "ancre": [4.841276, 45.756072], "precision_m": 25, "description": "Brasserie « à prétentions bourgeoises, à l'entrée du cours Gambetta », où Régis donne rendez-vous à Michel et où les deux garçons s'arrêtent (X §277 ; XXII §175). Enseigne réelle au n° 1 du cours, attestée de la fin du XIXe siècle aux années 2000 ; la continuité en 1925-1926 reste à lire dans l'Indicateur Henry.", "nom_actuel": "1 cours Gambetta, place Antonin-Jutard (3e)", "refs": ["X §277", "XXII §175"], "sources": ["http://www.ruesdelyon.net/cours/923-cours-gambetta.html", "ruesdelyon.net (place Antonin-Jutard)", "Inventaire général Auvergne-Rhône-Alpes, fonds Charbonnel, projet de décoration du plafond du tambour de la Brasserie de l'Étoile, cours Gambetta", "G. Chauvy, Lyon 40-44, 1985 (https://archive.org/details/lyon40440000chau)", "R. Le Mer, Francs-maçons résistants, Lyon 1940-1944, p. 181-182, via Guichet du Savoir, question 45271", "Rive Gauche, n° 7, décembre 1963, p. 15", "https://www.guichetdusavoir.org/question/voir/140950", "Base Adresse Nationale (1 cours Gambetta, 69003)"], "fiche": "../03_Fiches/04_geographie_critique.md", "fiche_lieu": "../03_Fiches/par_lieu/Guillotiere/G09_Brasserie_de_l_Etoile_1_cours_Gambetta.md"}, {"num": 22, "id": "grand_theatre", "code": "P13", "nom": "Grand Théâtre — actuel Opéra", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.836596, 45.767816]}, "ancre": [4.836596, 45.767816], "precision_m": 40, "description": "Salle de la saison wagnérienne de la jeunesse de Michel et Régis, du concert de janvier 1925 où Michel, qui a retardé son départ d'un jour après la rencontre du Six-Janvier (IV §64), revoit Anne-Marie venue avec ses parents, de la représentation de Tristan de la semaine sainte 1925 et d'une matinée de l'hiver 1925-1926. L'édifice est celui de 1831 ; la verrière de Jean Nouvel (1993) ne doit pas être projetée dans le roman.", "nom_actuel": "Opéra de Lyon, 1 place de la Comédie (1er)", "refs": ["I §114-115", "IV §64-74", "X §2", "X §172", "X §233-238", "X §256", "XXII §69", "XXV §259"], "sources": ["https://api.opera-lyon.com/files/89270949/opera_visite_v12_240131.pdf", "https://fr.wikipedia.org/wiki/Op%C3%A9ra_de_Lyon", "https://nominatim.openstreetmap.org/ (Opéra de Lyon)"], "fiche": "../03_Fiches/03_etablissements.md#grand_theatre", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P13_Grand_Theatre_actuel_Opera.md"}, {"num": 23, "id": "maison_doree", "code": "P02", "nom": "Maison Dorée — pavillon occidental de Bellecour", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.830836, 45.75762]}, "ancre": [4.830836, 45.75762], "precision_m": 30, "description": "Café de la place Bellecour dont on installait l'été les guéridons sous les marronniers : lieu public préféré de Michel, terrasse de juin 1926, et repère de la promenade nocturne de XXIII. Identifié au pavillon occidental de la place, aujourd'hui Le Rectangle ; la continuité de l'enseigne en 1923-1926 reste à confirmer dans un annuaire.", "nom_actuel": "pavillon Le Rectangle, place Bellecour (2e)", "refs": ["I §127", "XV §406", "XXIII §49", "XXIII §123", "XXXI §80"], "sources": ["https://www.visiterlyon.com/decouvrir/sites-et-monuments/sites-et-monuments-remarquables/les-pavillons-de-la-place-bellecour", "https://commons.wikimedia.org/wiki/Category:Le_Rectangle_(Place_Bellecour,_Lyon)", "https://fr.wikipedia.org/wiki/Place_Bellecour", "https://www.guichetdusavoir.org/question/voir/35772"], "fiche": "../03_Fiches/03_etablissements.md#maison_doree", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P02_Maison_Doree_pavillon_occidental_de_Bellecour.md"}, {"num": 24, "id": "cafe_morel", "code": "P03", "nom": "Café Morel — angle de Bellecour et de la rue de l'Hôtel-de-Ville", "statut": "probable", "certitude": "B", "geometry": {"type": "Point", "coordinates": [4.833802, 45.758345]}, "ancre": [4.833802, 45.758345], "precision_m": 40, "description": "Café devant lequel Régis attend Michel, arrivé par le train de nuit, au printemps 1925 (fin avril ou début mai). Le roman ne précise pas l'angle ; l'histoire locale place le Café Morel à l'angle de la place et de l'ancienne rue de l'Hôtel-de-Ville (P16). Identification très probable ; l'enseigne en 1925 et l'angle exact restent à confirmer.", "nom_actuel": "106 rue du Président-Édouard-Herriot / 12 place Bellecour (2e)", "refs": ["XI §82"], "sources": ["https://collections.bm-lyon.fr/PER00313711/ISSUE_PDF", "https://www.lyoncapitale.fr/actualite/la-nouvelle-pizzeria-la-mieux-placee-de-lyon", "Lyon People, « L'histoire des brasseries lyonnaises #1 » (2 janvier 2025)", "Mérimée PA00117833 (immeuble 12 place Bellecour / 106 rue du Président-Édouard-Herriot)", "https://api-adresse.data.gouv.fr/search/?q=106%20rue%20du%20Pr%C3%A9sident%20Edouard%20Herriot%20Lyon&limit=1"], "fiche": "../03_Fiches/03_etablissements.md#cafe_morel", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P03_Cafe_Morel_angle_de_Bellecour_et_de_la_rue_de_l_Ho.md"}, {"num": 25, "id": "salle_rameau", "code": "P14", "nom": "Salle Rameau", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.830735, 45.768422]}, "ancre": [4.830735, 45.768422], "precision_m": 30, "description": "Salle de concerts : tournée du Vieux-Colombier (vers 1922), récital de Cortot où Michel retrouve Régis (janvier 1926), concert symphonique de février 1926 où Michel conduit Anne-Marie, « retours de la salle Rameau » avec Régis. Les décors actuels ne sont pas ceux du récit.", "nom_actuel": "salle Rameau, 29-31 rue de la Martinière (1er)", "refs": ["I §96", "Notes §2", "XXIII §221", "XXIII §242", "XXV §106-137", "XXV §140", "XXXIII §293"], "sources": ["https://patrimoine.auvergnerhonealpes.fr/dossier/IA69003088", "Carthalia (salle Rameau, ouverte le 8 novembre 1908)", "Lyon Capitale (inauguration de 1908), cité par la contre-vérification U04", "https://nominatim.openstreetmap.org/ (Salle Rameau)"], "fiche": "../03_Fiches/03_etablissements.md#salle_rameau", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P14_Salle_Rameau.md"}, {"num": 26, "id": "conservatoire_bondy", "code": "D08", "nom": "Salle du Conservatoire (Palais de Bondy)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.828784, 45.765865]}, "ancre": [4.828784, 45.765865], "precision_m": 60, "description": "Soirée de bienfaisance du chapitre XXIX (printemps 1926) : Anne-Marie joue une comédie en costume 1880 ; Michel visite les coulisses et la loge (XXIX §28-31), puis le buffet « dressé dans le hall », servi par des « maîtres d'hôtel de chez Bernier et Millet » (XXIX §56). Le Nouvelliste et le Tout-Lyon en rendent compte (XXIX §58). Bâtiment attesté ; salle non établie.", "nom_actuel": "Palais de Bondy, 18 quai de Bondy (salle Molière) (5e)", "refs": ["XXVII §13", "XXIX §26", "XXIX §28-31", "XXIX §55-56", "XXIX §58", "XXIX §120"], "sources": ["https://mairie5.lyon.fr/actualite/patrimoine/la-ville-devoile-les-travaux-realises-au-palais-de-bondy", "https://fonsespecials.udl.cat/bitstream/handle/10459.2/2367/FRV_19240203_pr.pdf?isAllowed=y&sequence=1", "https://www.conservatoire-lyon.fr/le-conservatoire/presentation-conservatoire-de-lyon/histoire-conservatoire-de-lyon/", "Archives municipales de Lyon, liste des voies anciennes (voies_anciennes.txt) : « Bondy (quai de) / Flandre (quai de) / renommé en 1811 »"], "fiche": "../03_Fiches/03_etablissements.md#conservatoire_bondy", "fiche_lieu": "../03_Fiches/par_lieu/Rive_droite/D08_Salle_du_Conservatoire_Palais_de_Bondy.md"}, {"num": 27, "id": "mere_brazier", "code": "P35", "nom": "Chez Brazier — la mère Brazier", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.83723, 45.771395]}, "ancre": [4.83723, 45.771395], "precision_m": 30, "description": "Restaurant d'Eugénie Brazier : Michel y dîne avec Vignon en octobre 1925 ; le 14 juillet 1926, Michel et Anne-Marie projettent d'y déjeuner (repas non raconté). Le roman ne nomme pas la rue.", "nom_actuel": "La Mère Brazier, 12 rue Royale (1er)", "refs": ["XX §162", "XXXIII §296-297"], "sources": ["https://lamerebrazier.fr/en/story-eugenie-brazier/", "https://api-adresse.data.gouv.fr/search/?q=12%20rue%20Royale%20Lyon&limit=1"], "fiche": "../03_Fiches/03_etablissements.md#mere_brazier", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P35_Chez_Brazier_la_mere_Brazier.md"}, {"num": 28, "id": "cintra", "code": "P10", "nom": "Bar du Cintra — rue de la Bourse", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.836932, 45.764366]}, "ancre": [4.836932, 45.764366], "precision_m": 30, "description": "Bar à cocktails « près de la Bourse », rendez-vous de la jeunesse à la mode : Michel y rejoint Vignon (octobre 1925), promet un cocktail à Anne-Marie (printemps-juin 1926), et y ouvre avec Régis leur dernière soirée (novembre 1927). L'établissement de la rue de la Bourse date de 1921 ; son aménagement des années 1920 n'est pas restitué.", "nom_actuel": "Le Cintra, 43 rue de la Bourse (2e)", "refs": ["XX §162", "XXVII §126", "XXXI §19", "XXXVII §15-33", "XXXVII §42"], "sources": ["https://restaurant-cintra.fr/?lang=en", "https://www.guichetdusavoir.org/question/voir/48969", "https://api-adresse.data.gouv.fr/search/?q=43%20rue%20de%20la%20Bourse%20Lyon&limit=1"], "fiche": "../03_Fiches/03_etablissements.md#cintra", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P10_Bar_du_Cintra_rue_de_la_Bourse.md"}, {"num": 29, "id": "carlton", "code": "P34", "nom": "Hôtel Carlton", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.836664, 45.761035]}, "ancre": [4.836664, 45.761035], "precision_m": 30, "description": "Hôtel où Michel retient une chambre « à titre de sécurité » et passe une nuit vers le 27-28 mai 1926 ; la « Chauve-Souris » y est descendue, ce qui l'empêche de s'y établir et le conduit au Lugdunum. Immeuble de 1894 ; exploitation hôtelière datée des années 1920 par des sources commerciales.", "nom_actuel": "hôtel Carlton, 4 rue Jussieu (2e)", "refs": ["XXX §110", "XXX §146", "XXX §155", "XXX §167-175", "XXXI §1", "XXXI §15"], "sources": ["https://mgallery.accor.com/fr/hotels/2950/story.html", "https://www.historichotels.org/hotels-resorts/hotel-carlton-lyon-mgallery/history", "https://api-adresse.data.gouv.fr/search/?q=4%20rue%20Jussieu%20Lyon&limit=1"], "fiche": "../03_Fiches/03_etablissements.md#carlton", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P34_Hotel_Carlton.md"}, {"num": 30, "id": "lugdunum", "code": "B13", "nom": "hôtel Lugdunum, place Jules-Ferry (Brotteaux)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.858874, 45.766669]}, "ancre": [4.858874, 45.766669], "precision_m": 60, "description": "Le roman nomme le Lugdunum, « grand hôtel des Brotteaux tout nouvellement inauguré », où Michel s’installe début juin 1926 et reçoit Anne-Marie (chambre 348). Hôtel réel, ouvert en 1924 face à la gare des Brotteaux, devenu Palace-Hôtel en 1926 ; les scènes sont composites selon Rebatet.", "nom_actuel": "5 place Jules-Ferry (Lyon 6e), immeuble de l’ancien hôtel", "refs": ["XXXI §15", "XXXI §19", "XXXI §80", "XXXII §120", "XXXIII §215-218", "XXXIII §257", "XXXIII §268", "XXXIII §272", "Intermèdes §15", "XXXIV §21", "XXXIV §41", "XXXIV §169", "XXXV §12", "Récit de Guitte §3", "Récit de Guitte §16", "Récit de Guitte §24", "Récit de Guitte §44", "Récit de Guitte §47"], "sources": ["Inventaire général Auvergne-Rhône-Alpes, dossier IA69002103 : https://patrimoine.auvergnerhonealpes.fr/dossier/IA69002103 (protégé par un anti-robot le 24/10/2026)", "Guichet du Savoir, question 66835 (19/06/2020) : https://www.guichetdusavoir.org/question/voir/66835", "Guichet du Savoir, question 58072 (05/04/2017) : https://www.guichetdusavoir.org/question/voir/58072", "« Feu l’Hôtel Lugdunum », Rive Gauche, n° 7, déc. 1963, p. 15 : https://drive.google.com/open?id=1oVAfg3hjm2s_FOErqVLgWot0XmL8QpiY", "https://api-adresse.data.gouv.fr/search/?q=5%20place%20Jules%20Ferry%20Lyon&limit=1", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet. Dossier d’un chef-d’œuvre maudit, Lausanne, L’Âge d’Homme, 2001 (lu par extraits : https://books.google.fr/books?id=qGVj0Eca7okC)"], "fiche": "../03_Fiches/03_etablissements.md#lugdunum", "fiche_lieu": "../03_Fiches/par_lieu/Brotteaux_et_3e_nord/B13_hotel_Lugdunum_place_Jules_Ferry_Brotteaux.md"}, {"num": 31, "id": "eldorado", "code": "G12", "nom": "L'Eldorado — théâtre du 33 cours Gambetta", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.8455, 45.754544]}, "ancre": [4.8455, 45.754544], "precision_m": 40, "description": "Théâtre et cinéma réel, « calamiteux théâtre de faubourg » dont Michel et Régis font le tour pendant leurs grands dialogues (XII §136 ; XXXVII §150), et près duquel le trio se retrouve (XIX §190) ; « le pâté de bâtisses, derrière l'Eldorado » est un lieu rituel de rendez-vous. Démoli en 1993 : la carte indique l'ancien emplacement.", "nom_actuel": "immeuble du 33 cours Gambetta (3e), à l'emplacement du théâtre démoli", "refs": ["XII §136", "XII §152", "XII §167", "XIII §25", "XIII §39", "XVII §231", "XVII §278", "XIX §190", "XXII §228", "XXII §255", "XXII §258", "XXXVII §150"], "sources": ["https://www.archives-lyon.fr/guides/eldorado-l", "https://patrimoine.auvergnerhonealpes.fr/dossier/IA69007531", "https://pop.culture.gouv.fr/notice/merimee/PA00117990", "carte postale « Le Nouveau Théâtre » (1916), site Carthalia", "Base Adresse Nationale (33 cours Gambetta, 69003)"], "fiche": "../03_Fiches/03_etablissements.md#eldorado", "fiche_lieu": "../03_Fiches/par_lieu/Guillotiere/G12_L_Eldorado_theatre_du_33_cours_Gambetta.md"}, {"num": 32, "id": "cinema_thomassin", "code": "P37", "nom": "Cinéma de la rue Thomassin — probablement la Scala", "statut": "probable", "certitude": "B", "geometry": {"type": "Point", "coordinates": [4.83477, 45.761694]}, "ancre": [4.83477, 45.761694], "precision_m": 40, "description": "Cinéma anonyme de la rue Thomassin où Michel voit un Harold Lloyd et un Ben Turpin, quelques jours après le 6 janvier 1926. La Scala, seule salle de la rue attestée dans les années 1920 selon le répertoire des Archives, en est le candidat très probable ; un programme de janvier 1926 confirmerait.", "nom_actuel": "20 rue Thomassin (2e)", "refs": ["XXIII §180"], "sources": ["https://www.archives-lyon.fr/guides/scala-la", "https://www.archives-lyon.fr/sites/aml/files/2023-11/IR_cinemas.pdf", "https://api-adresse.data.gouv.fr/search/?q=20%20rue%20Thomassin%20Lyon&limit=1"], "fiche": "../03_Fiches/03_etablissements.md#cinema_thomassin", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P37_Cinema_de_la_rue_Thomassin_probablement_la_Scala.md"}, {"num": 33, "id": "jesuitiere_fourviere", "code": "D02", "nom": "La « jésuitière » de Fourvière", "statut": "probable", "certitude": "B", "geometry": {"type": "Point", "coordinates": [4.82256, 45.76074]}, "ancre": [4.82256, 45.76074], "precision_m": 80, "description": "Le « grand bâtiment blanc » que Régis montre « à droite » en redescendant de Fourvière (X §30), « la caserne de Fourvière » des Jésuites (XI §93) et les murs que l'on voit du quai Tilsit, « de l'autre côté du fleuve, sur la colline » (XXXI §38). En novembre 1927, Régis doit y entrer « six jours plus tard » (XXXVII §6) ; « Dans quatre jours, tu sonneras à la porte de la jésuitière » (XXXVII §134). Le point désigne l'édifice vu, pas une étape de formation historiquement attestée.", "nom_actuel": "Conservatoire à rayonnement régional, 4 montée du Cardinal-Decourtray (5e)", "refs": ["X §25", "X §30", "XI §93", "XXXI §38", "XXXVII §6", "XXXVII §134"], "sources": ["https://www.conservatoire-lyon.fr/le-conservatoire/presentation-conservatoire-de-lyon/histoire-conservatoire-de-lyon/", "D. Avon, « Une école théologique à Fourvière ? », dans É. Fouilloux et B. Hours (dir.), Les jésuites à Lyon, ENS Éditions, 2005 : https://books.openedition.org 5.764714]}, "ancre": [4.833714, 45.764714], "precision_m": 30, "description": "Église du grand mariage Martin-Dumont – Béchetoile (novembre 1925), où Anne-Marie est demoiselle d'honneur et quêteuse ; Michel et Régis y assistent depuis les bas-côtés. La noce est rappelée au chapitre XXII.", "nom_actuel": "église Saint-Nizier, place Saint-Nizier (2e)", "refs": ["XXI §207-209", "XXII §13", "XXII §66"], "sources": ["https://www.lyon.fr/lieu/moyen-age/eglise-catholique-saint-nizier", "https://nominatim.openstreetmap.org/ (Église Saint-Nizier)"], "fiche": "../03_Fiches/05_religieux_et_enseignement.md#saint_nizier", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P38_Eglise_Saint_Nizier.md"}, {"num": 38, "id": "paroisse_ainay", "code": "P39", "nom": "Paroisse Saint-Martin d'Ainay (basilique)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.827331, 45.753628]}, "ancre": [4.827331, 45.753628], "precision_m": 30, "description": "Paroisse dont Rouchouze est fabricien : la mention situe le milieu catholique du négociant, sans scène dans l'église.", "nom_actuel": "basilique Saint-Martin d'Ainay (2e)", "refs": ["XX §102"], "sources": ["https://www.visiterlyon.com/decouvrir/sites-et-monuments/patrimoine-religieux/basilique-abbaye-saint-martin-d-ainay", "https://nominatim.openstreetmap.org/ (Basilique Saint-Martin d'Ainay)"], "fiche": "../03_Fiches/05_religieux_et_enseignement.md#paroisse_ainay", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P39_Paroisse_Saint_Martin_d_Ainay_basilique.md"}, {"num": 39, "id": "facultes_catholiques", "code": "P29", "nom": "Facultés catholiques (« la Catho ») — cours du P. Chaleyssin", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.82814, 45.75643]}, "ancre": [4.82814, 45.75643], "precision_m": 120, "description": "Établissement où étudie Régis (« ta Fac… à la Catho ») et où Michel s'inscrit pour suivre trois fois par semaine le cours de philosophie du P. Chaleyssin (automne 1925), dans une « petite salle d'école primaire libre ». L'institution est certaine ; la salle et le bâtiment des lettres et de la philosophie en 1925 ne le sont pas.", "nom_actuel": "Université catholique de Lyon, îlot rue du Plat – place Antoine-Vollon (2e)", "refs": ["II §82", "XVII §116", "XIX §109", "XIX §215", "XX §102", "XXI §30", "XXI §81-82", "XXVIII §14"], "sources": ["https://www.ucly.fr/l-ucly/linstitution/notre-histoire/", "Archives municipales de Lyon, liste des voies anciennes (voies_anciennes.txt) : Antoine Vollon (place), Saint-Michel (place), renommée en 1907", "https://api-adresse.data.gouv.fr/search/?q=35%20rue%20du%20Plat%20Lyon&limit=1"], "fiche": "../03_Fiches/05_religieux_et_enseignement.md#facultes_catholiques", "fiche_lieu": "../03_Fiches/par_lieu/Presqu_ile/P29_Facultes_catholiques_la_Catho_cours_du_P_Chaleyssi.md"}, {"num": 40, "id": "maristes_regis", "code": "D07", "nom": "Anciens maîtres maristes de Régis (externat Sainte-Marie ?)", "statut": "hypothese", "certitude": "D", "geometry": {"type": "Polygon", "coordinates": [[[4.82667, 45.76693], [4.82764, 45.76675], [4.82835, 45.76626], [4.82861, 45.76558], [4.82835, 45.76491], [4.82764, 45.76441], [4.82667, 45.76423], [4.82571, 45.76441], [4.825, 45.76491], [4.82474, 45.76558], [4.825, 45.76626], [4.82571, 45.76675], [4.82667, 45.76693]]]}, "ancre": [4.826674166666667, 45.76558166666666], "precision_m": 150, "description": "Le roman dit seulement que les maristes furent les « anciens maîtres » de Régis (X §84), sans nommer l'école ni la ville. L'externat Sainte-Marie des Pères maristes, à Lyon, est le candidat : son modèle, F. Varillon, y fut demi-pensionnaire. Lieu de l'avant-récit, sans scène ; hypothèse.", "nom_actuel": "Sainte-Marie Lyon, 4 montée Saint-Barthélemy (5e)", "refs": ["X §84"], "sources": ["https://www.sainte-marie-lyon.fr/sainte-marie-lyon-celebre-ses-130-ans/", "Ph. Rocher, « De l'enseignement à l'éducation jésuite en région lyonnaise (1850-1950) », dans Les jésuites _Lyon", "Archives départementales du Rhône et de la Métropole, 6 M 661, recensement de 1931, Lyon, « Gambetta (cours) », vue 3 : https://archives.rhone.fr/ark:/28729/mjxvdpf36g8b (image : https://archives.rhone.fr/images/61fe52d5-23b3-4124-8643-db30dbfe4e52.jpg)"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Rive_droite/D09_Cour_d_appel_palais_de_justice_de_Saint_Jean.md"}, {"num": 138, "id": "boutique_cure_russe", "code": "D10", "nom": "Boutique du « curé russe » (quartier Saint-Jean)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Polygon", "coordinates": [[[4.8255, 45.7597], [4.828, 45.7595], [4.829, 45.7615], [4.8294, 45.7647], [4.8279, 45.765], [4.8262, 45.763], [4.8255, 45.7597]]]}, "ancre": [4.8276666666666666, 45.762233333333334], "precision_m": 250, "description": "Anne-Marie prend ses leçons de physique et de chimie chez un ancien dignitaire de l'Église russe, qui « nichait dans une vieille boutique du quartier Saint-Jean » (XXVII §12). Michel assiste aux séances dans le « capharnaüm » de l'exilé ; on en redescend par un escalier (XXVII §105-106). Les après-midi de leçon se prolongent sur les pentes de Fourvière (XXVII §102). Attesté pour le quartier ; boutique non identifiée.", "nom_actuel": "quartier Saint-Jean, Vieux-Lyon (5e)", "refs": ["XXVII §12", "XXVII §102", "XXVII §105-106", "XXXI §22"], "sources": [], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Rive_droite/D10_Boutique_du_cure_russe_quartier_Saint_Jean.md"}, {"num": 139, "id": "quartier_saint_jean", "code": "D11", "nom": "Quartier Saint-Jean", "statut": "atteste", "certitude": "A", "geometry": {"type": "Polygon", "coordinates": [[[4.8255, 45.7597], [4.828, 45.7595], [4.829, 45.7615], [4.8294, 45.7647], [4.8279, 45.765], [4.8262, 45.763], [4.8255, 45.7597]]]}, "ancre": [4.8276666666666666, 45.762233333333334], "precision_m": 250, "description": "Le « noir quartier Saint-Jean » du vieux Lyon, sur la rive droite de la Saône, autour de la primatiale : cadre du rite du soir ont-d'Or (villa des cousins)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.80259, 45.8828]}, "ancre": [4.80259, 45.8828], "precision_m": 800, "description": "Villa des cousins communs de Michel et de Régis, « des bords de Saône », où ils séjournent en septembre 1924 (III §2, §13) ; c'est là que Régis révèle Brouilly à Michel (Notes §21), le « dimanche au bord de la Saône » (IX §161), « dans les prés qui descendaient vers la Saône » (XXII §432). Michel revoit la villa du train (XV §27). Commune attestée ; villa non localisée.", "nom_actuel": "Saint-Germain-au-Mont-d'Or (Métropole de Lyon)", "refs": ["III §2", "III §13", "V §15", "IX §161", "XV §27", "XXII §432", "XXX §58", "Notes §21"], "sources": ["https://fr.wikipedia.org/wiki/Saint-Germain-au-Mont-d%27Or"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E05_Saint_Germain_au_Mont_d_Or_villa_des_cousins.md"}, {"num": 144, "id": "charbonnieres", "code": "E06", "nom": "Charbonnières-les-Bains (casino, concours hippique, bar)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.7459, 45.7787]}, "ancre": [4.7459, 45.7787], "precision_m": 1400, "description": "Station de l'ouest lyonnais : courses où vont les parents d'Yvonne (XII §36), bar où l'on voit Yvonne (XIX §223), concours hippique et casino où Michel suit la famille Villars en tramway, avant de rentrer « treize kilomètres à pied » (XXIX §235-240), dancing proposé par Anne-Marie (XXX §119), promenade en voiture de la bande (XXXII §9-10).", "nom_actuel": "Charbonnières-les-Bains (Métropole de Lyon)", "refs": ["XII §36", "XIX §223", "XXIX §235-240", "XXX §119", "XXX §127", "XXX §131", "XXXII §9-10"], "sources": ["P. A. Ifri, Les Deux Étendards de Lucien Rebatet : dossier d'un chef-d'œuvre maudit, Lausanne, L'Âge d'Homme, 2001, extraits plein texte : https://archive.org/details/lesdeuxetendards0000ifri"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E06_Charbonnieres_les_Bains_casino_concours_hippique_b.md"}, {"num": 145, "id": "brignais", "code": "E07", "nom": "Brignais (villa de la grand-mère, « la grange »)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.75407, 45.67398]}, "ancre": [4.75407, 45.67398], "precision_m": 800, "description": "Village banlieusard au terminus d'un tramway, où la grand-mère d'Anne-Marie a l'une de ses quatre villas (XV §270). « La nuit de Brignais », dans une grange, est une des nuits des amoureux (III §47 ; IV §14 ; X §199). Excursion du lundi 13 juillet 1925 : café, petit pont et ruisseau, grille du parc, départ de la promenade aux aqueducs (XV §265-277). Commune attestée ; sous-lieux non localisés.", "nom_actuel": "Brignais (Rhône)", "refs": ["III §47", "IV §14", "X §199", "XII §175", "XV §265", "XV §270-277", "XXV §196"], "sources": ["https://fr.wikipedia.org/wiki/Ancien_tramway_de_Lyon"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E07_Brignais_villa_de_la_grand_mere_la_grange.md"}, {"num": 146, "id": "vaugneray", "code": "E08", "nom": "Vaugneray", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.656, 45.738]}, "ancre": [4.656, 45.738], "precision_m": 600, "description": "Destination tirée au sort de l'excursion du dimanche 12 juillet 1925 : le quatuor y va par le tortillard de Saint-Just (D05), monte au village, déjeune à l'auberge et s'assied sous un noyer (XV §75-80). Le « pré de Vaugneray » et la « tonnelle de Vaugneray » deviennent des souvenirs (XVIII §107 ; XXII §181). Anne-Marie propose d'y retourner en 1926 (XXX §119).", "nom_actuel": "Vaugneray (Rhône)", "refs": ["XV §75-80", "XV §114", "XVIII §101", "XVIII §107", "XXII §1", "XXII §181", "XXVIII §78", "XXVIII §89", "XXX §119", "XXX §131", "XXX §145", "XXXII §1", "XXXII §14"], "sources": ["https://www.ruesdelyon.net/places/137-place-pere-francois-varillon.html", "https://fr.wikipedia.org/wiki/Ancien_tramway_de_Lyon"], "fiche": "", "fiche_l , Bron (hypothèse)", "refs": ["IX §152-154"], "sources": ["Métropole de Lyon, référentiel des voies (couche adr_voie_lieu.adrlineairevoie, rue Wilson, Bron) : https://data.grandlyon.com", "https://www.ville-bron.fr/bienvenue-bron/decouvrir-bron/memoire/le-domaine-des-essarts"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E13_Avenue_President_Wilson_Bron.md"}, {"num": 151, "id": "vinatier", "code": "E14", "nom": "Vinatier (asile de Bron)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Polygon", "coordinates": [[[4.89256, 45.73934], [4.90167, 45.73638], [4.904, 45.73858], [4.90567, 45.74567], [4.90406, 45.74468], [4.89936, 45.7457], [4.89802, 45.74651], [4.89828, 45.74724], [4.8966, 45.74664], [4.89256, 45.73934]]]}, "ancre": [4.900024444444444, 45.74341555555556], "precision_m": 150, "description": "Seuil de la ville et point de départ à pied vers chez Carreau : le taxi dépose le trio « à l'entrée de Vinatier » (XXII §86) ; la guinguette est dite « à Vinatier » (XXVI §140) ; l'usine du prétexte est « entre ton Bron et Vinatier » (XXVI §154). Aucune scène dans l'asile.", "nom_actuel": "Centre hospitalier Le Vinatier, boulevard Pinel, Bron", "refs": ["XXII §86", "XXVI §140", "XXVI §154"], "sources": ["https://fr.wikipedia.org/wiki/Centre_hospitalier_Le_Vinatier", "https://www.openstreetmap.org/way/210093986", "https://fr.wikipedia.org/wiki/Ancien_tramway_de_Lyon"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E14_Vinatier_asile_de_Bron.md"}, {"num": 152, "id": "route_beaunand", "code": "E15", "nom": "Route de Beaunand (Oullins – Beaunant)", "statut": "hypothese", "certitude": "D", "geometry": {"type": "LineString", "coordinates": [[4.801905, 45.714771], [4.798777, 45.715622], [4.795979, 45.716298], [4.795012, 45.716938], [4.789629, 45.717695], [4.78796, 45.718246], [4.786741, 45.71903], [4.785112, 45.719885], [4.783503, 45.72038], [4.781443, 45.72019], [4.779326, 45.720094], [4.778411, 45.719482]]}, "ancre": [4.786741, 45.71903], "precision_m": 300, "description": "Route sur laquelle se trouve la villa Martin-Dumont, « au bout du pays » (XXXIII §2). Seule mention ; elle localise la villa (E04).", "nom_actuel": "rue Francisque-Jomard, Oullins-Pierre-Bénite (hypothèse)", "refs": ["XXXIII §2"], "sources": ["Métropole de Lyon, référentiel des voies (couche adr_voie_lieu.adrlineairevoie, rue Francisque Jomard, Oullins-Pierre-Bénite) : https://data.grandlyon.com"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E15_Route_de_Beaunand_Oullins_Beaunant.md"}, {"num": 153, "id": "aqueducs_gier", "code": "E16", "nom": "Aqueducs romains (aqueduc du Gier, Brignais – Chaponost)", "statut": "probable", "certitude": "B", "geometry": {"type": "LineString", "coordinates": [[4.73399, 45.69042], [4.73532, 45.69158], [4.73877, 45.69613]]}, "ancre": [4.73532, 45.69158], "precision_m": 500, "description": "But de « la fatidique promenade aux aqueducs » du lundi 13 juillet 1925, de Brignais vers le bourg du tramway (XV §268, §277-297), pendant laquelle Yvonne se confie à Michel. Les vestiges eux-mêmes ne sont pas décrits.", "nom_actuel": "aqueduc du Gier : pont-siphon du Garon, la Gagère (Chaponost, Brignais)", "refs": ["XV §268", "XV §277"], "sources": ["https://fr.wikipedia.org/wiki/Aqueduc_du_Gier", "OpenStreetMap via Nominatim : objets « Pont-siphon du Garon », « Aqueduc du Gier » (route de la Gagère) et « Arches du Plat de l'Air », https://nominatim.openstreetmap.org"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Environs/E16_Aqueducs_romains_aqueduc_du_Gier_Brignais_Chaponos.md"}, {"num": 154, "id": "brouilly", "code": "R01", "nom": "Brouilly (mont et chapelle)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.65397, 46.10904]}, "ancre": [4.65397, 46.10904], "precision_m": 600, "description": "Colline des nuits sacrées des amoureux, chaque 28 septembre : la première (1923) racontée par Régis (III §51-53), la deuxième (1924, IV §14), la troisième (1925, XIX §37-40, §225-281). Elle est vue du train à hauteur de Belleville (IX §28-34 ; X §3). Lieu « mythique » du roman (130 paragraphes), ici réduit à ses mentions topographiques.", "nom_actuel": "mont Brouilly (Odenas / Saint-Lager, Rhône)", "refs": ["III §51", "III §53", "IV §14", "IX §28", "IX §31-34", "X §3-10", "XII §175", "XIX §37-40", "XIX §225", "XIX §234", "XIX §280", "XXII §210", "Notes §21"], "sources": ["https://fr.wikipedia.org/wiki/Mont_Brouilly", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet : dossier d'un chef-d'œuvre maudit, Lausanne, L'Âge d'Homme, 2001, extraits plein texte : https://archive.org/details/lesdeuxetendards0000ifri", "https://www.sombreval.com/Les-deux-etendards-Dossier-d-un-chef-d-oeuvre-maudit-Le-pere-Francois-Varillon-et-Lucien-Rebatet_a46.html"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R01_Brouilly_mont_et_chapelle.md"}, {"num": 155, "id": "belleville", "code": "R02", "nom": "Belleville (gare, maison Marlieux, petit café)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.72926, 46.11192]}, "ancre": [4.72926, 46.11192], "precision_m": 200, "description": "Trois objets : la gare où les amoureux prirent le train pour Lyon après le deuxième Brouilly (IX §34) ; « la grande maison des cousines Marlieux », alibi traditionnel des nuits de Brouilly (XIX §225) ; « le petit café de Belleville » du premier Brouilly (XIX §280). La gare est attestée ; maison et café ne sont pas localisés.", "nom_actuel": "gare de Belleville-sur-Saône, Belleville-en-Beaujolais", "refs": ["IX §34", "XIX §225", "XIX §280"], "sources": ["https://fr.wikipedia.org/wiki/Belleville-en-Beaujolais", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet : dossier d'un chef-d'œuvre maudit, Lausanne, L'Âge d'Homme, 2001, extraits plein texte : https://archive.org/details/lesdeuxetendards0000ifri"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R02_Belleville_gare_maison_Marlieux_petit_cafe.md"}, {"num": 156, "id": "villefranche_mongre", "code": "R03", "nom": "Collège Notre-Dame de Mongré", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.71178, 45.99216]}, "ancre": [4.71178, 45.99216], "precision_m": 200, "description": "Collège jésuite où Régis va voir le « professeur de rhéto » après la nuit de Claveisolles (XI §28, Pâques 1925), où le P. Reboul part faire un intérim (XIX §15-16) et où Régis fait une retraite de quatre jours (Intermèdes §16). Lieu visité, jamais décrit.", "nom_actuel": "ensemble scolaire Notre-Dame de Mongré, Villefranche-sur-Saône", "refs": ["XI §28", "XIX §15-16", "Intermèdes §16"], "sources": ["https://fr.wikipedia.org/wiki/Notre-Dame_de_Mongr%C3%A9", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet : dossier d'un chef-d'œuvre maudit, Lausanne, L'Âge d'Homme, 2001, extraits plein texte : https://archive.org/details/lesdeuxetendards0000ifri"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R03_College_Notre_Dame_de_Mongre.md"}, {"num": 157, "id": "trevoux", "code": "R04", "nom": "Trévoux (château des de Berlhe, alibi)", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.77346, 45.94121]}, "ancre": [4.77346, 45.94121], "precision_m": 2000, "description": "Évocation sans scène : pour l'alibi du troisième Brouilly, Anne-Marie prétendra être invitée au château « presque célèbre » de la famille d'Édith de Berlhe, « à côté de Trévoux » (XIX §225). Personne n'y va. La commune est réelle ; le château, peut-être inventé, n'est pas identifié.", "nom_actuel": "Trévoux (Ain)", "refs": ["XIX §225"], "sources": [], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R04_Trevoux_chateau_des_de_Berlhe_alibi.md"}, {"num": 158, "id": "claveisolles", "code": "R05", "nom": "Claveisolles", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.49401, 46.10022]}, "ancre": [4.49401, 46.10022], "precision_m": 500, "description": "Village du haut Beaujolais où Anne-Marie passe les vacances de Pâques 1925 avec sa mère et Yvonne (X §245). Régis l'y rejoint en train, se cache à « l'auberge, à un kilomètre du village », et passe avec elle une nuit chaste dans une grange puis un abri de bergers (XI §25-27). « Claveisolles » devient, avec Brouilly, un nom sacré du couple.", "nom_actuel": "Claveisolles (Rhône)", "refs": ["X §245", "XI §25-29", "XI §31", "XI §50", "XII §33", "XII §82", "XII §130", "XII §175", "XV §174", "XV §531", "XVIII §101", "XXV §51", "XXXII §177"], "sources": ["https://fr.wikipedia.org/wiki/Claveisolles", "F. Varillon, Beauté du monde et souffrance des hommes. Entretiens avec Ch. Ehlinger, Paris, Bayard, 2005 (1re éd. Centurion, 1980), extraits plein texte : https://archive.org/details/beautedumondeets0000vari"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R05_Claveisolles.md"}, {"num": 159, "id": "vienne", "code": "R06", "nom": "Vienne", "statut": "atteste", "certitude": "A", "geometry": {"type": "Point", "coordinates": [4.87477, 45.52524]}, "ancre": [4.87477, 45.52524], "precision_m": 1500, "description": "Évocations sans scène : ville de Josette, correspondante de Michel au temps de la rhétorique (I §60), et adresse d'une amie de Cécile, sœur de Michel (XI §137). Le couvent de Cécile et de Josette, dont les pensionnaires quittent le train avant Lyon (IV §2-6), pourrait y être (hypothèse).", "nom_actuel": "Vienne (Isère)", "refs": ["I §60", "IV §2-6", "XI §137"], "sources": ["L. Rebatet, Memorie di un fascista 1941-1947, trad. it., 1993 : https://archive.org/details/memorie-di-un-fascista", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet : dossier d'un chef-d'œuvre maudit, Lausanne, L'Âge d'Homme, 2001, extraits plein texte : https://archive.org/details/lesdeuxetendards0000ifri"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R06_Vienne.md"}, {"num": 160, "id": "eperviere", "code": "R07", "nom": "L'Épervière (village de Michel)", "statut": "probable", "certitude": "C", "geometry": {"type": "Point", "coordinates": [4.99383, 45.29032]}, "ancre": [4.99383, 45.29032], "precision_m": 1000, "description": "Bourg natal de Michel, « à quelques kilomètres du Rhône », où son père est notaire (I §1) : la grande maison et le clos (I §104), séjours de vacances (II-IV, XI, XVI-XVIII, XXXVII), petite gare à voie unique à deux kilomètres (XVII §1), vogue d'août (XVII §216). Sous-lieux : château du Mouchet (II §2), café des Viallon à Beau-chemin (XVI §25-26 ; XVII §172). Graphie « l'Éparvière » à partir de XX.", "nom_actuel": "Moras-en-Valloire (Drôme)", "refs": ["I §1", "I §104", "I §112", "I §121", "II §2", "III §1", "IV §1", "XI §1", "XVI §6", "XVI §25-26", "XVII §1", "XVII §172", "XVII §216", "XVIII §165", "XXI §29", "XXXVII §1"], "sources": ["https://fr.wikipedia.org/wiki/Moras-en-Valloire", "P. A. Ifri, Les Deux Étendards de Lucien Rebatet : dossier d'un chef-d'œuvre maudit, Lausanne, L'Âge d'Homme, 2001, extraits plein texte : https://archive.org/details/lesdeuxetendards0000ifri", "L. Rebatet, Memorie di un fascista 1941-1947, trad. it., 1993 : https://archive.org/details/memorie-di-un-fascista", "L. Rebatet, Les Décombres, Paris, Denoël, 1942 : https://archive.org/details/LesDecombre"], "fiche": "", "fiche_lieu": "../03_Fiches/par_lieu/Region/R07_L_Eperviere_village_de_Michel.md"}, {"num": 161, "id": "saint_chely", "code": "R08", "nom": "Collège de Saint-Chély", "statut": "probable", "certitude": "B", "geometry": {"type": "Point", "coordinates": [4.5098, 45.47483]}, "ancre": [4.5098, 45.47483], "precision_m": 1500, "description": "Collège religieux où Michel est interne de treize ans au baccalauréat de philosophie (chapitre I) : « gros établissement religieux du Massif Central » dominant une cité de charbonnages et d'aciéries, peuplé d'élèves lyonnais et stéphanois. Ses maîtres maristes sont les « tortionnaires » de Michel (X §84). Lieu hors de Lyon ; Saint-Chély-d'Apcher (Lozère), qui prête son nom, ne doit pas être cartographié.", "nom_act
