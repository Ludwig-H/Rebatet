- id: G08
  nom: appartement des Villars, « 3 bis du Cours Gambetta »
  secteur: G
  categorie: domicile
  statut_nom: implicite
  identification: >-
    Domicile d'Anne-Marie (famille du conseiller Villars) : immeuble d'angle du
    début du cours Gambetta (côté nord, 3e) et d'une « petite rue » — la rue
    Mortier — avec balcon de salle à manger, escalier de service, brasserie à
    violons voisine.
  nom_1925: 3 bis cours Gambetta, angle rue Mortier
  nom_actuel: 3 bis cours Gambetta (Lyon 3e)
  certitude: B
  geo: {ban: "3 bis cours Gambetta 69003 Lyon"}
  motifs: ['3 bis du cours gambetta', 'chez les villars', 'maison d[’'']anne-marie', 'appartement des villars']
  cle: "« j'aurais juré que c'était toi qui entrais un peu avant midi, au 3 bis du Cours Gambetta » (XXIX, § 108)"
  arguments: |
    Adresse donnée par le texte. Concordances : « à l'entrée du cours Gambetta »,
    « à l'angle de la première petite rue » après la brasserie de l'Étoile (XXII §
    177) ; chambre sur « la petite rue » (XII § 205-206 ; XXXI § 52-54) ; petites
    rues à escalier perpendiculaires au quai toutes proches (XXII § 228) ; square
    arboré avant le quai (XXXIII § 159) = place des Squares (auj. Jutard/Raspail).
    Distance au carrefour de la place Antique : 297 m (texte : « trois cents »).
    Le n° 3 bis existe aujourd'hui à l'angle de la rue Mortier.
  enquete: 04_Enquetes/05_domiciles_Villars_et_Lanthelme.md
  sources: [Base Adresse Nationale]

