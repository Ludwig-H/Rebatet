  identification: Groupe scolaire du quartier Béchevelin (arch. Alexis Santu), auj. école Gilbert-Dru ; achevé en 1924.
  nom_1925: groupe scolaire Béchevelin, rue de la Vierge
  nom_actuel: école Gilbert-Dru, 1 rue Saint-Michel / 28 Grande-Rue de la Guillotière
  certitude: B
  geo: {latlon: [45.75348, 4.84318]}
  motifs: ['école neuve', "horloge de l['’]école", 'platement républicain']
  cle: "« en face, s'allongeait une stupide école neuve, du style le plus platement républicain » (IX, § 87)"
  arguments: "Seule école publique « neuve » (1908-1924) à proximité immédiate d'un carrefour de ruelles situé à ~50-100 m de la rue de Marseille ; horloge d'angle conforme à XII § 164."
  enquete: 04_Enquetes/01_place_Antique.md
  sources: [Inventaire général ARA, livret de concertation « cours d'école Gilbert-Dru » 2022]

