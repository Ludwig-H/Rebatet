# Répertoire des lieux lyonnais des *Deux Étendards* (Lucien Rebatet, 1951)
#
# Source de vérité du dossier : les fichiers lieux.geojson, lieux.csv,
# index_occurrences.md, les fiches de 03_Fiches_lieux et les cartes sont
# générés à partir de ce fichier par scripts/02_construire_donnees.py.
#
# Champs
#   id          identifiant stable (lettre du secteur + numéro)
#   nom         nom du lieu tel que le roman le donne (forme la plus courante)
#   secteur     G Guillotière ; B 3e nord, Brotteaux ; P Presqu'île ;
#               D rive droite de la Saône ; E environs ; R région
#   categorie   domicile | cafe | hotel | lieu-surnomme | voie | place |
#               eglise | enseignement | spectacle | pont-quai | gare-transport |
#               parc | quartier | commerce | localite
#   statut_nom  reel | surnom | deguise | fictif | implicite
#   identification  ce que le lieu est (ou était) dans la réalité
#   nom_1925 / nom_actuel   toponymie (cf. 02_Contexte_historique)
#   certitude   A certain ; B très probable ; C probable ; D hypothèse ;
#               E fictif ou non localisable (point symbolique)
#   geo         méthode de géolocalisation (adresse BAN, axe de voie,
#               carrefour calculé, coordonnées relevées) ; rayon = zone (m)
#   motifs      expressions régulières pour la concordance (insensibles à la casse)
#   cle         citation-clé (chapitre, §) — courte
#   arguments   raisonnement d'identification
#   enquete     dossier d'enquête détaillé (04_Enquetes) le cas échéant
#   sources     références externes

lieux:

# ---------------------------------------------------------------- GUILLOTIÈRE
- id: G01
  nom: place Antique
  secteur: G
  categorie: lieu-surnomme
  statut_nom: surnom
  identification: >-
    Carrefour de ruelles de la vieille Guillotière où se croisent l'ancienne rue
    de la Vierge (auj. rue Gilbert-Dru), la rue Béchevelin et la rue Saint-Michel,
    devant l'angle à horloge du groupe scolaire du quartier Béchevelin (auj. école
    Gilbert-Dru), achevé vers 1924 ; la placette voisine d'Aguesseau (auj. place
    Commandant-Claude-Bulard) en fait sans doute partie.
  nom_1925: carrefour rue de la Vierge / rue Béchevelin / rue Saint-Michel
  nom_actuel: angle rue Gilbert-Dru / rue Saint-Michel (Lyon 7e)
  certitude: B
  geo: {latlon: [45.75340, 4.84270], rayon: 60}
  motifs: ['place antique', 'antique place', 'place des adieux', 'notre place\b']
  cle: "« nous sommes à cinquante mètres de la rue de Marseille […] Ma maison est à deux cents mètres, celle d'Anne-Marie à trois cents » (IX, § 86)"
  arguments: |
    Faisceau d'indices textuels : 50 m de la rue de Marseille, 200 m de chez Régis,
    300 m de chez Anne-Marie (IX § 86) ; « croisement de ruelles », longue bâtisse
    jaunâtre d'un siècle, « école neuve » en face (IX § 87) dont l'horloge sonne les
    quarts (XII § 164) ; « petites bicoques basses de la rue de la Vierge » (XXVI §
    219) ; on y arrive « par la petite rue Saint-Michel » (XXIII § 230) ; on en
    sort vers le cours Gambetta par la rue de Marseille (XXIII § 209).
    Vérification : la rue de la Vierge, renommée rue Gilbert-Dru en 1945 (AML),
    borde le groupe scolaire Béchevelin (dessins d'A. Santu 1908-1921, ensemble
    achevé en 1924), dont l'angle coupé sur la rue Saint-Michel porte une horloge.
    Distances mesurées : 297 m jusqu'au 3 bis cours Gambetta (Villars), ≈ 200-250 m
    jusqu'à la place du Pont (Lanthelme), 60-95 m jusqu'à la rue de Marseille.
  enquete: 04_Enquetes/01_place_Antique.md
  sources: [AML voies anciennes, Inventaire général ARA (groupe scolaire Béchevelin), ruesdelyon.net (rue Gilbert-Dru)]

