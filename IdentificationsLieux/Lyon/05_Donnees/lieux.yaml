- id: G10
  nom: appartement des Lanthelme
  secteur: G
  categorie: domicile
  statut_nom: implicite
  identification: "Domicile de Régis : cours Gambetta, porte d'allée sous « la mesquine marquise du bazar des « Galeries Modernes » », près de l'angle de la place du Pont, en face du pâté de l'Eldorado."
  nom_1925: cours Gambetta, côté sud (7e), entre la place du Pont et la rue des Passants
  nom_actuel: cours Gambetta (7e), n° pairs vers 20-30
  certitude: C
  geo: {latlon: [45.75428, 4.84468], rayon: 70}
  motifs: ['porte des lanthelme', 'trottoir des lanthelme', 'chez les lanthelme', 'allée de régis']
  cle: "« Ils avaient déjà passé deux fois devant la porte des Lanthelme, traversé l'avenue déserte, ils faisaient le tour traditionnel du pâté de bâtisses, derrière l'Eldorado » (XXXVII, § 151)"
  arguments: |
    Note XIX [1] : Anne-Marie et Régis habitent le cours Gambetta « à deux cents
    mètres l'un de l'autre » ; place Antique à 200 m (IX § 86). On passe devant la
    porte, puis on traverse l'avenue pour faire le tour du pâté de l'Eldorado (n°
    33, côté nord) : la porte des Lanthelme est donc en face, côté sud, près de
    l'angle de la place du Pont.
  enquete: 04_Enquetes/05_domiciles_Villars_et_Lanthelme.md

