- id: G05
  nom: café de la Voûte (« la Voûte »)
  secteur: G
  categorie: cafe
  statut_nom: surnom
  identification: >-
    « Minuscule cafeton » tenu par une Ardéchoise « sous la voûte Saint-Michel » ;
    la rue Saint-Michel débouche, à son extrémité est, sous une grande voûte
    percée dans l'immeuble de la rue de la Madeleine, près de l'église Saint-Louis.
  nom_1925: rue Saint-Michel, sous la voûte (côté rue de la Madeleine)
  nom_actuel: débouché de la rue Saint-Michel sur la rue de la Madeleine (7e)
  certitude: C
  geo: {latlon: [45.75045, 4.84790], rayon: 40}
  motifs: ['\bvoûte saint-michel', '\bla voûte\b', 'café de la voûte', 'de la « voûte »']
  cle: "« un minuscule cafeton, qui contenait à peine quatre ou cinq tables, sous la voûte Saint-Michel » (XXIV, § 7)"
  arguments: |
    L'expression « voûte Saint-Michel » désigne un repère réel du quartier ; la
    seule voûte connue sur la rue Saint-Michel est son débouché sous l'immeuble de
    la rue de la Madeleine. Réserve : ce point est à ~430 m de la place Antique,
    alors que le texte présente la Voûte comme « au plus près » ; un passage voûté
    disparu plus à l'ouest n'est pas exclu. Enseigne réelle non vérifiée
    (annuaire Henry à consulter).
  enquete: 04_Enquetes/06_cafes_et_garnis_de_la_Guille.md
  sources: [ruesdelyon.net (rue Saint-Michel)]

