# ------------------------------------------------------- 3e NORD ET BROTTEAUX
- id: B01
  nom: rue du Six-Janvier (rue Créqui)
  secteur: B
  categorie: lieu-surnomme
  statut_nom: surnom
  identification: >-
    Surnom donné par le trio à la rue Créqui, et d'abord à l'angle de la rue
    Créqui et de la rue Rabelais (3e), où Michel vit Anne-Marie pour la première
    fois le 6 janvier 1925, sur le trajet quotidien entre le cours Boudier et le
    cours Gambetta.
  nom_1925: angle rue Créqui / rue Rabelais
  nom_actuel: angle rue de Créqui / rue Rabelais (3e)
  certitude: A
  geo: {inter: [Rue de Créqui, Rue Rabelais], commune: Lyon 3e}
  motifs: ['six-janvier', 'six janvier', 'rue créqui', 'rue de janvier', 'angle de la rue rabelais']
  cle: "« Ils s'étaient arrêtés sur le trottoir du Six-Janvier, but du pèlerinage, à l'angle de la rue Créqui et de la rue Rabelais » (XI)"
  arguments: |
    L'angle est donné en toutes lettres ; le surnom commémore la date de la
    première rencontre (chap. IV, intitulé « La rue Créqui » ; « Il aura duré un an
    moins un jour », XXII). Pseudonyme « Robert Créqui (petit hommage à la rue du
    Six-Janvier) » (XIII § 15). La rue Rabelais (tracée en 1847) existe bien en
    1925 et croise la rue Créqui à ~100 m au sud du cours Lafayette.
  enquete: 04_Enquetes/02_rue_du_Six-Janvier.md
  sources: [AML voies anciennes, ruesdelyon.net (rue Rabelais)]

- id: B02
  nom: café des Alpes (« les Alpes »)
  secteur: B
  categorie: cafe
  statut_nom: reel
  identification: >-
    Café populaire de l'avenue de Saxe tenu par un ménage de Savoyards, avec une
    « salle de sociétés » ouverte au couchant ; à un angle de l'avenue « un peu
    après le cours La Fayette » en venant de la place Morand — vraisemblablement
    l'angle de la rue Rabelais (à 200 m de l'angle du Six-Janvier), à défaut celui
    des rues Le Royer ou de Bonnel.
  nom_1925: avenue de Saxe (3e), entre le cours La Fayette et la rue de Bonnel
  nom_actuel: avenue Maréchal-de-Saxe (3e)
  certitude: C
  geo: {inter: [Avenue Maréchal de Saxe, Rue Rabelais], commune: Lyon 3e, rayon: 120}
  motifs: ['café des alpes', '« alpes »', 'aux alpes', 'des « alpes »', 'chemin des alpes']
  cle: "« Un peu après le cours La Fayette, le couple sembla hésiter […], il obliqua vers la droite, il s'arrêta à l'angle de l'avenue de Saxe, au café des Alpes » (XXII, § 37)"
  arguments: |
    L'enseigne est « Café des Alpes » (et non « des Deux-Alpes ») : X § 151,
    XXII § 37. L'avenue est nommée ; le café est à un angle, peu après le cours La
    Fayette ; il est accessible à pied depuis la place de l'Abondance et depuis
    le Saint-Sacrement (petit-déjeuner après la messe de 7 h). Le premier
    carrefour au sud du cours La Fayette est la rue Rabelais (≈ 100 m), qui mène
    en 200 m à l'angle du Six-Janvier. Enseigne réelle non vérifiée (annuaire).
  enquete: 04_Enquetes/03_cafe_des_Alpes.md

