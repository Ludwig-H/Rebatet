- id: P23
  nom: quai Perrache (« notre banc »)
  secteur: P
  categorie: pont-quai
  statut_nom: reel
  identification: >-
    Banc de la rive gauche de la Saône, à la pointe nord-ouest de Perrache, en
    face de Fourvière, près du pont du chemin de fer (ligne de Saint-Irénée) et de
    deux bateaux-lavoirs : lieu de la « vocation » de Régis (30 sept. 1923).
  nom_1925: quai de la Saône à Perrache (officiellement quai Rambaud)
  nom_actuel: quai Rambaud, abords du pont Kitchener-Marchand (2e)
  certitude: C
  geo: {latlon: [45.74980, 4.82280], rayon: 120}
  motifs: ['quai perrache', 'quai de perrache']
  cle: "« En face, sur la colline, les jardins et les couvents de Fourvière s'estompaient peu à peu. Des péniches reposaient […] sur la Saône sombre » (XII, § 171)"
  arguments: |
    Le texte place le banc au bord de la Saône (péniches, Fourvière en face) et non
    au « quai de la gare » (XII § 175). Le quai Perrache officiel longe le Rhône ;
    la rive de Saône de la presqu'île de Perrache est le quai Rambaud. « Quai
    Perrache » est donc ici un usage large (le quai de Perrache). Le pont
    ferroviaire « tout proche » fixe le banc près du franchissement de la Saône
    par la ligne de Saint-Irénée, à la hauteur de la gare.
  enquete: 04_Enquetes/07_quai_Perrache_le_banc.md

